[gcode_macro M106]
# We use .1 because Klipper's fan module accepts this specific naming
rename_existing: M106.1
gcode:
    {% if params.P is defined and params.P|int == 2 %}
        # This handles the Aux Fan on the e3ng
        {% set speed = params.S|default(255)|float / 255 %}
        SET_FAN_SPEED FAN=aux_fan SPEED={speed}
    {% else %}
        # This passes the command back to the native firmware fan control
        M106.1 {rawparams}
    {% endif %}

[gcode_macro M107]
description: Overrides M107 to allow OrcaSlicer P2 Aux Fan control
rename_existing: M107.1
gcode:
    # 1. If P2 is sent, stop the Aux Fan
    {% if params.P is defined and params.P|int == 2 %}
        SET_FAN_SPEED FAN=aux_fan SPEED=0
    
    # 2. If no P2 is sent, stop the Toolhead Fan
    {% else %}
        # We call M106.1 S0 because we know M106.1 works on your e3ng
        M106.1 S0
    {% endif %}